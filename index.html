<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' 'sha256-mTJ4cJaTm2Gw95GeXEpZdvEEY9ybh6FZu1bwcNE7QlY=';
                 style-src 'self' https://fonts.googleapis.com 'sha256-Ji1UslKBIeFAUjRU+6GY3Yak5Q/PdBpmBS4zdshiGfY=' 'sha256-94IHAwqZOHPP2ykTpic3GQDxOYct6jCHc4tEHx0JMi0=';
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src 'self';
                 base-uri 'self';
                 form-action 'self';
                 object-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />

  <title>Kravr — เข้าสู่ระบบ</title>
  <meta name="description" content="เข้าสู่ระบบ Kravr เพื่อช้อปสินค้าหรือสั่งอาหาร (เว็บสาธิต — ระบบล็อกอินเป็นการจำลอง)" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script src="theme-init.js"></script>
  <script src="login.js" defer></script>
</head>
<body class="auth-page">
  <button class="icon-btn auth-page__theme" type="button" data-theme-toggle aria-label="สลับโหมดสว่าง/มืด">
    <svg class="ic-sun" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <svg class="ic-moon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>

  <main class="auth-shell">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-.8 11.2A2 2 0 0 1 15.2 21H8.8a2 2 0 0 1-2-1.8L6 8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        <span class="auth-brand__name">Kravr</span>
      </div>
      <h1 class="auth-title">ยินดีต้อนรับ</h1>
      <p class="auth-sub">เข้าสู่ระบบเพื่อช้อปสินค้าหรือสั่งอาหาร</p>

      <form class="auth-form" data-login-form novalidate>
        <label class="field"><span>อีเมล</span><input type="email" name="email" autocomplete="username" placeholder="you@email.com" required /></label>
        <label class="field"><span>รหัสผ่าน</span><input type="password" name="password" autocomplete="current-password" placeholder="รหัสผ่าน" required /></label>
        <label class="auth-remember"><input type="checkbox" name="remember" checked /><span>จดจำฉันไว้ในระบบ</span></label>
        <p class="auth-error" data-login-error hidden role="alert"></p>
        <button class="btn btn--block btn--lg" type="submit">เข้าสู่ระบบ</button>
      </form>

      <div class="auth-demo">
        <p class="auth-demo__t">บัญชีสำหรับทดลอง (เดโม)</p>
        <div class="auth-demo__row"><span>อีเมล</span><code data-demo-email>demo@kravr.co</code></div>
        <div class="auth-demo__row"><span>รหัสผ่าน</span><code data-demo-pass>Kravr#2025</code></div>
        <button class="auth-demo__fill" type="button" data-demo-fill>กรอกให้อัตโนมัติ</button>
      </div>
      <p class="auth-note">ระบบล็อกอินนี้เป็นการจำลองสำหรับเดโม — ไม่มีการส่งหรือบันทึกข้อมูลไปยังเซิร์ฟเวอร์จริง</p>
    </div>
  </main>
</body>
</html>
